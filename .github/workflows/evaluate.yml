name: evaluate

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/medreach-final-security-verification

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [bootstrap, tailwind, skeleton]
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Create artifact directory
        run: |
          mkdir -p data/raw

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

      - name: Build production variant
        run: npm --workspace @medreach/variant-${{ matrix.variant }} run build

      - name: Compute RWD Security Risk Score
        run: |
          node evaluation/scoring/risk-score.js
